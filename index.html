<style>
/* Layout: persistent slim top bar + hash-routed full-width views; cards stack to one column at phone width */
:root{
  color-scheme: light;
  --bg:#f9f9f7; --surface:#fcfcfb; --surface-raised:#ffffff;
  --text:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --border:rgba(11,11,11,0.10); --grid:#e1e0d9;
  --series-1:#2a78d6; --series-1-ink:#184f95;
  --series-2:#eb6834; --series-2-ink:#9e4017;
  --good:#0ca30c; --warning:#c98000; --critical:#d03b3b;
  --accent:#2a78d6; --accent-contrast:#ffffff;
  --radius:12px;
  --font: "Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface-raised:#232322;
    --text:#f0efec; --text-secondary:#c3c2b7; --text-muted:#9b9a93;
    --border:rgba(255,255,255,0.12); --grid:#2c2c2a;
    --series-1:#3987e5; --series-1-ink:#bcd6f7;
    --series-2:#d95926; --series-2-ink:#f6c3a6;
    --good:#2bc92b; --warning:#fab219; --critical:#e66767;
    --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-raised:#232322;
  --text:#f0efec; --text-secondary:#c3c2b7; --text-muted:#9b9a93;
  --border:rgba(255,255,255,0.12); --grid:#2c2c2a;
  --series-1:#3987e5; --series-1-ink:#bcd6f7;
  --series-2:#d95926; --series-2-ink:#f6c3a6;
  --good:#2bc92b; --warning:#fab219; --critical:#e66767;
  --accent:#3987e5;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  min-height:100%;
}
#app{
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:24px 64px;
  max-width:880px; margin:0 auto;
}
h1,h2,h3{text-wrap:balance; margin:0; font-weight:700}
p{margin:0}
a{color:var(--accent)}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--border); background:var(--surface);
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
}
.brand{font-weight:900; font-size:15px; letter-spacing:.01em}
.brand a{color:var(--text); text-decoration:none}
.topnav{display:flex; gap:4px; flex-wrap:wrap}
.tab{
  padding:7px 12px; border-radius:999px; font-size:13px; font-weight:500;
  color:var(--text-secondary); text-decoration:none; border:1px solid transparent;
}
.tab.is-active{background:var(--accent); color:var(--accent-contrast); font-weight:700}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; margin-top:16px;
}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.muted{color:var(--text-muted)}
.secondary-text{color:var(--text-secondary)}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--text-muted); text-transform:uppercase}
.btn{
  appearance:none; border:1px solid var(--border); background:var(--surface-raised); color:var(--text);
  padding:10px 16px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; font-family:var(--font);
}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.btn-primary{background:var(--accent); color:var(--accent-contrast); border-color:transparent}
.btn-primary:disabled{opacity:.45; cursor:not-allowed}
.btn-sm{padding:6px 10px; font-size:12.5px}
input[type=text],input[type=email],select{
  width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-raised); color:var(--text); font-family:var(--font); font-size:14px;
}
label.field{display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:700; color:var(--text-secondary); flex:1; min-width:180px}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); min-width:0}
th{color:var(--text-muted); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.04em}
tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto}
.pill{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700}
.pill-done{background:rgba(12,163,12,0.14); color:var(--good)}
.pill-wait{background:rgba(137,135,129,0.18); color:var(--text-secondary)}
.notice{border-radius:10px; padding:12px 14px; font-size:13.5px; border:1px solid var(--border); background:var(--surface-raised)}
.notice-warn{border-color:var(--warning); color:var(--text)}
.notice-critical{border-color:var(--critical); color:var(--text)}
.caution{font-size:12.5px; color:var(--text-secondary); line-height:1.6; border-top:1px dashed var(--border); padding-top:12px; margin-top:4px}
.progressbar{height:6px; border-radius:999px; background:var(--grid); overflow:hidden}
.progressbar > span{display:block; height:100%; background:var(--accent)}
.likert-item{padding:14px 0; border-bottom:1px solid var(--border)}
.likert-item:last-child{border-bottom:none}
.likert-text{font-size:14.5px; font-weight:500; margin-bottom:10px; line-height:1.55}
.likert-scale{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.likert-end{font-size:11.5px; color:var(--text-muted); min-width:0}
.likert-opts{display:flex; gap:10px; flex:1; justify-content:center; min-width:140px}
.likert-opt{position:relative; display:flex; align-items:center; justify-content:center}
.likert-opt input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
.likert-opt span{
  width:34px; height:34px; border-radius:999px; border:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--text-secondary); font-weight:700;
}
.likert-opt input:checked + span{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent)}
.mc-item{padding:16px 0; border-bottom:1px solid var(--border)}
.mc-item:last-child{border-bottom:none}
.mc-q{font-size:14.5px; font-weight:500; line-height:1.6; margin-bottom:10px}
.mc-index{display:inline-block; font-size:11.5px; font-weight:700; color:var(--accent); margin-right:6px}
.mc-opts{display:flex; flex-direction:column; gap:7px}
.mc-opt{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
  border:1px solid var(--border); cursor:pointer; font-size:13.5px;
}
.mc-opt input{position:absolute; opacity:0; width:0; height:0}
.mc-opt.is-selected{border-color:var(--accent); background:rgba(42,120,214,0.08)}
.mc-letter{
  width:22px; height:22px; border-radius:6px; background:var(--grid); color:var(--text-secondary);
  font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;
}
.mc-opt.is-selected .mc-letter{background:var(--accent); color:var(--accent-contrast)}
.timer{
  font-variant-numeric:tabular-nums; font-weight:700; font-size:14px; padding:5px 11px;
  border-radius:999px; background:var(--grid); color:var(--text-secondary);
}
.timer.is-low{background:rgba(208,59,59,0.16); color:var(--critical)}
.section-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px}
.bar-row{display:flex; align-items:center; gap:12px; padding:7px 0}
.bar-label{width:120px; flex:none; font-size:13px; font-weight:700; color:var(--text-secondary)}
.bar-track{flex:1; height:10px; border-radius:999px; background:var(--grid); overflow:hidden; min-width:0}
.bar-fill{height:100%; border-radius:999px}
.bar-value{width:68px; flex:none; text-align:right; font-size:13px; font-variant-numeric:tabular-nums; color:var(--text-secondary)}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--text-secondary); margin-top:6px}
.legend-dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px}
.stat-tile{border:1px solid var(--border); border-radius:10px; padding:14px; background:var(--surface-raised)}
.stat-tile .num{font-size:28px; font-weight:900; font-variant-numeric:tabular-nums}
.stat-tile .cap{font-size:12px; color:var(--text-muted); margin-top:2px}
.link-box{display:flex; gap:8px; align-items:center}
.link-box input{font-size:12.5px; font-family:ui-monospace,monospace}
.slider-row{display:flex; align-items:center; gap:12px; padding:8px 0}
.slider-row label{flex:0 0 150px; font-size:13px; color:var(--text-secondary); font-weight:700}
.slider-row input[type=range]{flex:1; accent-color:var(--accent)}
.slider-row .sv{width:30px; text-align:right; font-variant-numeric:tabular-nums; font-size:13px; font-weight:700}
.culture-cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px}
.flag{font-size:11.5px; font-weight:700; color:var(--critical); background:rgba(208,59,59,0.12); padding:2px 8px; border-radius:999px}
@media (max-width:560px){
  .bar-label{width:88px; font-size:12px}
  .stat-tile .num{font-size:24px}
}
</style>

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function fmtDate(ms){
  if(!ms) return "—";
  var d = new Date(ms);
  return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function fmtSec(s){
  s = Math.max(0, Math.round(s));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function csvCell(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; }
function pct(n){ return Math.round(n*100)/100; }

function scoreBigFive(answers){
  var sums={E:0,A:0,C:0,N:0,O:0}, counts={E:0,A:0,C:0,N:0,O:0};
  BIG_FIVE_ITEMS.forEach(function(item,i){
    var raw = answers[i];
    if(raw==null) raw = 3;
    var v = item.reverse ? (6-raw) : raw;
    sums[item.trait]+=v; counts[item.trait]++;
  });
  var out={};
  TRAIT_ORDER.forEach(function(t){ out[t]=pct(sums[t]/counts[t]); });
  return out;
}
function scoreAptitude(answers, track){
  var set = APTITUDE_SETS[track] || APTITUDE_SETS.new_grad;
  var cats=["logical","numerical","verbal"], out={}, totalCorrect=0, totalCount=0;
  cats.forEach(function(cat){
    var items=set[cat], correct=0;
    items.forEach(function(item,i){ if(answers[cat+"-"+i]===item.answerIndex) correct++; });
    out[cat]={correct:correct, total:items.length};
    totalCorrect+=correct; totalCount+=items.length;
  });
  out.overall={correct:totalCorrect, total:totalCount};
  return out;
}
function scoreCulture(answers, targets){
  var sums={}, counts={};
  CULTURE_AXES.forEach(function(a){ sums[a.key]=0; counts[a.key]=0; });
  CULTURE_ITEMS.forEach(function(item,i){
    var v = answers[i]; if(v==null) v=3;
    sums[item.axis]+=v; counts[item.axis]++;
  });
  var axisScores={}, diffSum=0;
  CULTURE_AXES.forEach(function(a){
    axisScores[a.key]=pct(sums[a.key]/counts[a.key]);
    diffSum += Math.abs(axisScores[a.key] - (targets[a.key]==null?3:targets[a.key]));
  });
  var matchPercent = Math.round((1 - (diffSum/CULTURE_AXES.length)/4)*100);
  return {axisScores:axisScores, matchPercent:Math.max(0,matchPercent)};
}

function buildRadarSVG(opts){
  var labels=opts.labels, series=opts.series, size=opts.size||260, maxValue=opts.maxValue||5;
  var n=labels.length, cx=size/2, cy=size/2, r=size/2-58;
  function point(i,value){
    var angle=(Math.PI*2*i/n)-Math.PI/2;
    var rad=r*(Math.max(0,Math.min(maxValue,value))/maxValue);
    return [cx+rad*Math.cos(angle), cy+rad*Math.sin(angle)];
  }
  var grid="";
  for(var ring=1; ring<=4; ring++){
    var val=maxValue*ring/4, pts=[];
    for(var i=0;i<n;i++) pts.push(point(i,val).join(","));
    grid += '<polygon points="'+pts.join(" ")+'" fill="none" stroke="var(--grid)" stroke-width="1"/>';
  }
  var axesSVG="";
  for(i=0;i<n;i++){
    var end=point(i,maxValue);
    axesSVG += '<line x1="'+cx+'" y1="'+cy+'" x2="'+end[0]+'" y2="'+end[1]+'" stroke="var(--grid)" stroke-width="1"/>';
    var angle=(Math.PI*2*i/n)-Math.PI/2;
    var lx=cx+(r+34)*Math.cos(angle), ly=cy+(r+34)*Math.sin(angle);
    axesSVG += '<text x="'+lx+'" y="'+ly+'" font-size="11.5" fill="var(--text-secondary)" text-anchor="middle" dominant-baseline="middle">'+esc(labels[i])+'</text>';
  }
  var seriesSVG="";
  series.forEach(function(s){
    var pts = s.values.map(function(v,i){ return point(i,v).join(","); }).join(" ");
    seriesSVG += '<polygon points="'+pts+'" fill="'+s.color+'" fill-opacity="0.18" stroke="'+s.color+'" stroke-width="2.5"/>';
    s.values.forEach(function(v,i){
      var p=point(i,v);
      seriesSVG += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="'+s.color+'"/>';
    });
  });
  return '<svg viewBox="0 0 '+size+' '+size+'" width="100%" style="max-width:'+size+'px;display:block;margin:0 auto" role="img" aria-label="radar chart">'+grid+axesSVG+seriesSVG+'</svg>';
}
function barChart(rows, maxValue, color){
  return rows.map(function(row){
    var w = maxValue>0 ? Math.max(2, Math.round(row.value/maxValue*100)) : 2;
    return '<div class="bar-row"><span class="bar-label">'+esc(row.label)+'</span>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:'+color+'"></div></div>'+
      '<span class="bar-value">'+esc(row.display)+'</span></div>';
  }).join("");
}

function genToken(len){
  len = len||14;
  var chars="abcdefghijklmnopqrstuvwxyz0123456789", out="";
  var bytes=new Uint8Array(len);
  (window.crypto||window.msCrypto).getRandomValues(bytes);
  for(var i=0;i<len;i++) out += chars[bytes[i]%chars.length];
  return out;
}

    ].map(csvCell).join(","));

}

// ---------- Candidate flow ----------
var cf = {token:null, phase:"loading", candidate:null, answers:{personality:{},aptitude:{},culture:{}}, step:"intro", aptRemaining:APTITUDE_SECONDS, aptTimer:null, showValidation:false};
function resetCfTimer(){ if(cf.aptTimer){ clearInterval(cf.aptTimer); cf.aptTimer=null; } }
function ensureCandidateLoaded(token){
  if(cf.token===token) return;
  resetCfTimer();
  cf.token=token; cf.phase="loading"; cf.candidate=null; cf.step="intro";
  cf.answers={personality:{},aptitude:{},culture:{}}; cf.aptRemaining=APTITUDE_SECONDS; cf.showValidation=false;
  if(!state.db){ cf.phase="signin-required"; return; }
  Promise.all([state.db.doc("candidates/"+token).get(), state.db.doc("results/"+token).get()]).then(function(res){
    if(cf.token!==token) return;
    var candSnap=res[0], resSnap=res[1];
    if(!candSnap.exists){ cf.phase="invalid"; }
    else if(resSnap.exists){ cf.phase="already-done"; cf.candidate=candSnap.data(); }
    else { cf.candidate=candSnap.data(); cf.phase="ready"; }
    paintApp();
  }).catch(function(){ cf.phase="error"; paintApp(); });
}
function startAptitudeTimer(){
  resetCfTimer();
  cf.aptTimer = setInterval(function(){
    cf.aptRemaining--;
    if(cf.aptRemaining<=0){ cf.aptRemaining=0; resetCfTimer(); goCultureStep(); return; }
    var t = document.getElementById("apt-timer");
    if(t){ t.textContent = fmtSec(cf.aptRemaining); t.className = "timer"+(cf.aptRemaining<60?" is-low":""); }
  }, 1000);
}
function goCultureStep(){ cf.step="culture"; paintApp(); }
function submitAssessment(){
  if(!state.db || !cf.candidate) return;
  resetCfTimer();
  var personality = scoreBigFive(cf.answers.personality);
  var aptitude = scoreAptitude(cf.answers.aptitude, cf.candidate.track);
  aptitude.timeUsedSec = APTITUDE_SECONDS - cf.aptRemaining;
  var targets = cultureConfig[cf.candidate.track] || DEFAULT_TARGETS;
  var culture = scoreCulture(cf.answers.culture, targets);
  var payload = {
    name: cf.candidate.name, track: cf.candidate.track,
    startedAt: cf.candidate.createdAt||Date.now(), completedAt: Date.now(),
    personality: personality, aptitude: aptitude, culture: culture
  };
  cf.step="submitting"; paintApp();
  Promise.all([
    state.db.doc("results/"+cf.token).set(payload),
    state.db.doc("candidates/"+cf.token).update({status:"completed", completedAt:Date.now()})
  ]).then(function(){ cf.step="done"; paintApp(); })
    .catch(function(){ cf.step="submit-error"; paintApp(); });
}
function renderCandidate(){
  var html = '<div class="topbar"><div class="brand"><a href="#">採用アセスメント</a></div></div><div id="app-body">';
  if(cf.phase==="signin-required"){ html += '<div class="card">'+signinNotice()+'</div>'; }
  else if(cf.phase==="loading"){ html += '<div class="card"><p class="muted">読み込み中…</p></div>'; }
  else if(cf.phase==="invalid"){ html += '<div class="card"><p>このリンクは無効です。発行元の採用担当者にお問い合わせください。</p></div>'; }
  else if(cf.phase==="already-done"){ html += '<div class="card"><p>この回答はすでに提出されています。ご協力ありがとうございました。</p></div>'; }
  else if(cf.phase==="error"){ html += '<div class="card"><p>読み込みに失敗しました。再読み込みしてください。</p></div>'; }
  else {
    var steps=["intro","personality","aptitude","culture","done"];
    var idx = steps.indexOf(cf.step)>=0?steps.indexOf(cf.step):0;
    if(cf.step!=="intro" && cf.step!=="done" && cf.step!=="submitting" && cf.step!=="submit-error"){
      html += '<div class="card" style="margin-top:12px"><div class="progressbar"><span style="width:'+Math.round(idx/4*100)+'%"></span></div></div>';
    }
    if(cf.step==="intro") html += renderCfIntro();
    else if(cf.step==="personality") html += renderCfPersonality();
    else if(cf.step==="aptitude") html += renderCfAptitude();
    else if(cf.step==="culture") html += renderCfCulture();
    else if(cf.step==="submitting") html += '<div class="card"><p class="muted">送信中…</p></div>';
    else if(cf.step==="submit-error") html += '<div class="card"><p>送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。</p><button class="btn btn-primary" data-action="retry-submit">再送信</button></div>';
    else if(cf.step==="done") html += '<div class="card"><h2 style="font-size:17px">ご回答ありがとうございました</h2><p class="secondary-text" style="margin-top:8px">回答内容は採用担当者に送付されます。選考結果については別途ご連絡いたします。</p></div>';
  }
  html += '</div>';
  return html;
}
function renderCfIntro(){
  var c = cf.candidate;
  var html = '<div class="card stack">';
  html += '<p class="eyebrow">'+esc(TRACK_LABELS[c.track]||c.track)+'</p>';
  html += '<h1 style="font-size:20px">'+esc(c.name)+' 様</h1>';
  html += '<p class="secondary-text">これから性格診断・適性診断・カルチャーフィット診断の3つを行います。全体で20分ほどかかります。適性診断には時間制限があります。回答中はこのページを閉じないようにお願いします。</p>';
  html += '<div class="caution">回答内容は選考の補助情報として利用され、この結果のみで合否が決まるものではありません。個人情報は適切に管理されます。</div>';
  html += '<div><button class="btn btn-primary" data-action="start-test">はじめる</button></div>';
  html += '</div>';
  return html;
}
function renderCfPersonality(){
  var answered = Object.keys(cf.answers.personality).length;
  var html = '<div class="card">';
  html += '<h2 style="font-size:16px;margin-bottom:4px">性格診断</h2><p class="muted" style="font-size:13px;margin-bottom:8px">各項目について、最も当てはまる度合いを選んでください。（'+answered+' / '+BIG_FIVE_ITEMS.length+'）</p>';
  BIG_FIVE_ITEMS.forEach(function(item,i){
    var sel = cf.answers.personality[i];
    var opts="";
    for(var v=1;v<=5;v++){
      opts += '<label class="likert-opt"><input type="radio" name="p-'+i+'" data-section="personality" data-index="'+i+'" value="'+v+'" '+(sel===v?"checked":"")+'><span>'+v+'</span></label>';
    }
    html += '<div class="likert-item"><p class="likert-text">'+esc(item.text)+'</p><div class="likert-scale"><span class="likert-end">そう思わない</span><div class="likert-opts">'+opts+'</div><span class="likert-end">そう思う</span></div></div>';
  });
  if(cf.showValidation && answered<BIG_FIVE_ITEMS.length){
    html += '<p style="color:var(--critical);font-size:13px;margin-top:10px">すべての項目に回答してください（未回答 '+(BIG_FIVE_ITEMS.length-answered)+' 件）。</p>';
  }
  html += '<div style="margin-top:14px"><button class="btn btn-primary" data-action="next-to-aptitude">次へ（適性診断）</button></div>';
  html += '</div>';
  return html;
}
function renderCfAptitude(){
  var set = APTITUDE_SETS[cf.candidate.track] || APTITUDE_SETS.new_grad;
  var cats=[["logical","論理"],["numerical","数的"],["verbal","言語"]];
  var html = '<div class="card">';
  html += '<div class="section-head"><h2 style="font-size:16px">適性診断</h2><span id="apt-timer" class="timer'+(cf.aptRemaining<60?" is-low":"")+'">'+fmtSec(cf.aptRemaining)+'</span></div>';
  html += '<p class="muted" style="font-size:13px;margin-bottom:8px">時間内にできるだけ多く回答してください。時間が0になると自動的に次へ進みます。</p>';
  var qNum=0;
  cats.forEach(function(catDef){
    var cat=catDef[0], label=catDef[1];
    html += '<h3 style="font-size:13px;color:var(--text-muted);margin:14px 0 4px">'+label+'</h3>';
    set[cat].forEach(function(item,i){
      qNum++;
      var sel = cf.answers.aptitude[cat+"-"+i];
      var opts = item.options.map(function(optText,oi){
        return '<label class="mc-opt'+(sel===oi?" is-selected":"")+'"><input type="radio" name="'+cat+"-"+i+'" data-section="aptitude" data-cat="'+cat+'" data-index="'+i+'" value="'+oi+'" '+(sel===oi?"checked":"")+'><span class="mc-letter">'+["A","B","C","D"][oi]+'</span><span>'+esc(optText)+'</span></label>';
      }).join("");
      html += '<div class="mc-item"><p class="mc-q"><span class="mc-index">Q'+qNum+'</span>'+esc(item.q)+'</p><div class="mc-opts">'+opts+'</div></div>';
    });
  });
  html += '<div style="margin-top:14px"><button class="btn btn-primary" data-action="next-to-culture">次へ（カルチャーフィット診断）</button></div>';
  html += '</div>';
  return html;
}
function renderCfCulture(){
  var answered = Object.keys(cf.answers.culture).length;
  var html = '<div class="card">';
  html += '<h2 style="font-size:16px;margin-bottom:4px">カルチャーフィット診断</h2><p class="muted" style="font-size:13px;margin-bottom:8px">働き方の好みについて、最も当てはまる度合いを選んでください。（'+answered+' / '+CULTURE_ITEMS.length+'）</p>';
  CULTURE_ITEMS.forEach(function(item,i){
    var sel = cf.answers.culture[i];
    var opts="";
    for(var v=1;v<=5;v++){
      opts += '<label class="likert-opt"><input type="radio" name="c-'+i+'" data-section="culture" data-index="'+i+'" value="'+v+'" '+(sel===v?"checked":"")+'><span>'+v+'</span></label>';
    }
    html += '<div class="likert-item"><p class="likert-text">'+esc(item.text)+'</p><div class="likert-scale"><span class="likert-end">そう思わない</span><div class="likert-opts">'+opts+'</div><span class="likert-end">そう思う</span></div></div>';
  });
  if(cf.showValidation && answered<CULTURE_ITEMS.length){
    html += '<p style="color:var(--critical);font-size:13px;margin-top:10px">すべての項目に回答してください（未回答 '+(CULTURE_ITEMS.length-answered)+' 件）。</p>';
  }
  html += '<div style="margin-top:14px"><button class="btn btn-primary" data-action="submit-test">回答を送信する</button></div>';
  html += '</div>';
  return html;
}

// ---------- dispatch ----------
function paintApp(){
  var route = getRoute();
  var app = document.getElementById("app");
  if(route.view==="home"){ app.innerHTML = renderHome(); }
  else if(route.view==="admin"){
    if(!state.canEdit){ app.innerHTML = renderNoAccess(); return; }
    var body = route.tab==="results" ? renderAdminResults() : route.tab==="culture" ? renderAdminCulture() : renderAdminCandidates();
    app.innerHTML = topbar(route.tab==="results"||route.tab==="culture"?route.tab:"candidates") + '<div id="app-body">' + body + '</div>';
  }
  else if(route.view==="result-detail"){
    if(!state.canEdit){ app.innerHTML = renderNoAccess(); return; }
    ensureResultDetailLoaded(route.token);
    app.innerHTML = renderResultDetail();
  }
  else if(route.view==="candidate"){
    ensureCandidateLoaded(route.token);
    app.innerHTML = renderCandidate();
  }
}
function render(){
  teardownSubs();
  var route = getRoute();
  if(route.view==="admin"){
    if(route.tab==="results") mountAdminResults();
    else if(route.tab==="culture") loadCultureConfig();
    else mountAdminCandidates();
  }
  paintApp();
}

document.addEventListener("change", function(e){
  var t = e.target;
  if(t.matches && t.matches('input[type=radio][data-section]')){
    var section = t.getAttribute("data-section");
    if(section==="aptitude"){
      var key = t.getAttribute("data-cat")+"-"+t.getAttribute("data-index");
      cf.answers.aptitude[key] = Number(t.value);
      var item = t.closest(".mc-item");
      if(item){ item.querySelectorAll(".mc-opt").forEach(function(o){ o.classList.remove("is-selected"); }); t.closest(".mc-opt").classList.add("is-selected"); }
    } else {
      cf.answers[section][Number(t.getAttribute("data-index"))] = Number(t.value);
    }
  }
  if(t.classList && t.classList.contains("culture-slider")){
    var track = t.getAttribute("data-track"), axis = t.getAttribute("data-axis");
    var sv = document.querySelector('[data-track-sv="'+track+'"][data-axis-sv="'+axis+'"]');
    if(sv) sv.textContent = t.value;
  }
});

document.addEventListener("click", function(e){
  var btn = e.target.closest && e.target.closest("[data-action]");
  if(!btn) return;
  var action = btn.getAttribute("data-action");
  if(action==="start-test"){ cf.step="personality"; paintApp(); }
  else if(action==="next-to-aptitude"){
    if(Object.keys(cf.answers.personality).length < BIG_FIVE_ITEMS.length){ cf.showValidation=true; paintApp(); return; }
    cf.showValidation=false; cf.step="aptitude"; paintApp(); startAptitudeTimer();
  }
  else if(action==="next-to-culture"){ goCultureStep(); }
  else if(action==="submit-test"){
    if(Object.keys(cf.answers.culture).length < CULTURE_ITEMS.length){ cf.showValidation=true; paintApp(); return; }
    submitAssessment();
  }
  else if(action==="retry-submit"){ submitAssessment(); }
  else if(action==="create-candidate"){
    var nameInput = document.getElementById("nc-name"), trackSelect = document.getElementById("nc-track");
    var name = nameInput.value.trim();
    if(!name || !state.db) return;
    var token = genToken();
    btn.disabled = true;
    state.db.doc("candidates/"+token).set({name:name, track:trackSelect.value, createdAt:Date.now(), status:"not_started"})
      .then(function(){ nameInput.value=""; btn.disabled=false; })
      .catch(function(){ btn.disabled=false; alert_inline("リンクの発行に失敗しました。編集者権限でサインインしているかご確認ください。"); });
  }
  else if(action==="copy-link"){
    var url = btn.getAttribute("data-url");
    copyText(url, btn);
  }
  else if(action==="export-csv"){ exportCsv(); }
  else if(action==="save-culture-targets"){ saveCultureTargets(); }
});

function alert_inline(msg){
  var app = document.getElementById("app-body") || document.getElementById("app");
  var box = document.createElement("div");
  box.className = "notice notice-critical";
  box.style.marginTop = "12px";
  box.textContent = msg;
  app.insertBefore(box, app.firstChild);
  setTimeout(function(){ box.remove(); }, 4000);
}
function copyText(text, btnEl){
  var original = btnEl.textContent;
  function flash(msg){ btnEl.textContent = msg; setTimeout(function(){ btnEl.textContent = original; }, 1500); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ flash("コピーしました"); }).catch(function(){ fallbackCopy(text, flash); });
  } else { fallbackCopy(text, flash); }
}
function fallbackCopy(text, flash){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); flash("コピーしました"); } catch(e){ flash("コピーできませんでした"); }
  document.body.removeChild(ta);
}

window.addEventListener("hashchange", render);

(async function boot(){
  try{
    state.db = (await claude.use("db")) || null;
  }catch(e){ state.db = null; }
  try{
    state.user = (await claude.use("user")) || null;
    state.canEdit = state.user ? await state.user.canEdit() : false;
  }catch(e){ state.canEdit = false; }
  try{
    state.downloads = (await claude.use("downloads")) || null;
  }catch(e){ state.downloads = null; }
  render();
})();
})();
</script>
